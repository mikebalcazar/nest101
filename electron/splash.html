<!doctype html>
<!--
  #079 — Pantalla de arranque de nest101.

  Mike: «hazlo como si fueran piezas de un modelo 3D, en gris claro mate con las
  aristas en negro del outline. Y que esté animado y se esté despiezando».

  Tres decisiones, y las tres tienen su motivo:

  · **La geometría va DENTRO de este archivo.** La versión anterior cargaba un
    PNG y el PNG no llegó al instalador: electron-builder no lo metió al asar
    aunque estuviera declarado. Un archivo suelto que tiene que viajar es un
    archivo que se puede quedar. Aquí no hay nada que empacar aparte.

  · **Se dibuja con lienzo 2D, no con un motor 3D.** Son cajas, y una caja en
    isométrico son tres polígonos. Así la animación no cuesta 700 KB de motor
    justo en el momento en que la máquina está arrancando el programa.

  · **La ventana es transparente y sin marco**, y el lienzo no pinta fondo: lo
    que se ve es el mueble recortado, no un recuadro.

  El bloque de piezas lo escribe `herramientas/portada.py` desde el mismo
  `iso.solidos_gabinete()` que despieza el programa. No se edita a mano.
-->
<meta charset="utf-8">
<title>nest101</title>
<style>
  html, body { height: 100%; margin: 0; background: transparent; overflow: hidden; }
  /* El nombre va ENCIMA del mueble, centrado: el mueble es el fondo y la marca
     es lo que se lee. Por eso el lienzo ocupa toda la ventana y el bloque de
     texto se centra sobre él, en vez de ir uno debajo del otro. */
  body {
    position: relative; -webkit-user-select: none; -webkit-app-region: drag;
    font: 12px/1.5 "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  /* la sombra va sobre el dibujo, no en una caja: una caja se vería de bloque */
  #mueble {
    position: absolute; inset: 0; width: 100%; height: 100%;
    filter: drop-shadow(0 16px 22px rgba(0, 0, 0, .40));
  }
  .marca {
    position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%);
    display: flex; flex-direction: column; align-items: center; gap: 3px;
  }
  /* Encima del mueble, el fondo dominante es GRIS CLARO, así que la letra va
     oscura. El resplandor blanco es para los huecos: cuando el despiece se
     abre, por ahí se ve el escritorio, que puede ser de cualquier color.
     Un recuadro detrás resolvería las dos cosas, y es justo lo que Mike no
     quiere: el resplandor hace el trabajo y no deja borde. */
  .filete {
    text-shadow:
      0 0 3px rgba(255, 255, 255, .95), 0 0 8px rgba(255, 255, 255, .9),
      0 0 18px rgba(255, 255, 255, .75), 0 1px 2px rgba(255, 255, 255, .95);
  }
  /* #082 — El logotipo de verdad, no el nombre escrito. La imagen va dentro
     del HTML (data:), como la geometría: si llega el splash, llega el logo.
     `.nm` se queda debajo como respaldo y sólo se ve si la imagen no cargara;
     el guion de abajo lo esconde en cuanto el logotipo aparece. */
  /* El resplandor va con `drop-shadow` y no con el `text-shadow` de `.filete`:
     sobre una imagen el segundo no hace nada. Se apila tres veces porque uno
     solo no despega el azul del gris del mueble. */
  .logo {
    display: block; width: 218px; height: auto; margin-bottom: 4px;
    filter: drop-shadow(0 0 2px rgba(255, 255, 255, .95))
            drop-shadow(0 0 7px rgba(255, 255, 255, .92))
            drop-shadow(0 0 16px rgba(255, 255, 255, .7));
  }
  .nm { font-size: 30px; font-weight: 300; letter-spacing: .12em; color: #171b21; }
  .nm b { font-weight: 700; color: #0080C1; }
  .barra {
    width: 190px; height: 3px; border-radius: 2px; overflow: hidden;
    background: rgba(23, 27, 33, .18); margin-top: 12px;
    box-shadow: 0 0 10px rgba(255, 255, 255, .85);
  }
  .barra i {
    display: block; height: 100%; width: 38%; border-radius: 2px;
    background: #0080C1; animation: v 1.25s ease-in-out infinite;
  }
  @keyframes v { 0% { margin-left: -38% } 100% { margin-left: 100% } }
  .paso { font-size: 11px; color: #39424e; min-height: 16px; margin-top: 4px; }
</style>

<script>
  window.paso = (t) => { document.getElementById("p").textContent = t; };

  // #082 — si el logotipo cargó, el nombre escrito sobra: dicen lo mismo. Si no
  // cargara, se queda el escrito y el arranque igual se ve. Nunca las dos cosas.
  (() => {
    const img = document.querySelector(".marca .logo");
    const txt = document.querySelector(".marca .nm");
    if (!img || !txt) return;
    const listo = () => { if (img.naturalWidth) txt.remove(); };
    img.complete ? listo() : img.addEventListener("load", listo);
  })();

  const cv = document.getElementById("mueble");
  const cx = cv.getContext("2d");
  const C30 = Math.cos(Math.PI / 6), S30 = Math.sin(Math.PI / 6);

  // El mismo isométrico de los planos (core/iso.py): 0° mira desde
  // arriba-frente-derecha. Se usa el de siempre para que el mueble del arranque
  // se vea igual que el del plano.
  const proy = (x, y, z) => [(x - y) * C30, (x + y) * S30 + z];
  // #080 — profundidad de ESTA proyección: el eje de la vista es (1,1,−1) y
  // z−x−y es lo único perpendicular a él. La fórmula vieja (x−y+z) no lo era,
  // y por eso se veía el interior del mueble con el mueble cerrado.
  const hondo = (x, y, z) => z - x - y;

  // Gris claro mate: la cara de arriba recibe más luz, la de la derecha menos.
  // Los tres tonos van bien separados a propósito. En una tabla de 18 mm el
  // canto mide unos 3 px en pantalla, y si el canto y la cara casi comparten
  // tono la tabla se lee como lámina. La diferencia de tono ES el espesor.
  const TONO = { arriba: "#f1f1f1", frente: "#d7d7d7", lado: "#b6b6b6" };
  const TINTA = "#101317";

  function caras(p) {
    const { x, y, z, dx, dy, dz } = p;
    return [
      ["arriba", [[x, y, z + dz], [x + dx, y, z + dz],
                  [x + dx, y + dy, z + dz], [x, y + dy, z + dz]]],
      ["frente", [[x, y, z], [x + dx, y, z], [x + dx, y, z + dz], [x, y, z + dz]]],
      // #080 — el costado que se ve es el de −X, no el de +X. Dibujar el de
      // +X era pintar la cara de atrás de cada tabla: la tabla salía corrida
      // su propio espesor y el canto quedaba del lado que no toca.
      ["lado",   [[x, y, z], [x, y + dy, z],
                  [x, y + dy, z + dz], [x, y, z + dz]]],
    ];
  }

  // ── Silueta ────────────────────────────────────────────────────────────────
  // Una caja en isométrico se ve como un hexágono. Contorneando cada cara por
  // separado todas las líneas pesan igual y el ojo no encuentra dónde termina
  // la tabla: parece papel doblado. Contorno grueso por fuera y línea fina
  // adentro = sólido. Es el mismo criterio del outline de los planos.
  function silueta(p) {
    const { x, y, z, dx, dy, dz } = p;
    const v = [];
    for (const a of [x, x + dx])
      for (const b of [y, y + dy])
        for (const c of [z, z + dz]) v.push(proy(a, b, c));
    v.sort((m, n) => m[0] - n[0] || m[1] - n[1]);
    const giro = (o, a, b) =>
      (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
    const media = (pts) => {
      const r = [];
      for (const q of pts) {
        while (r.length >= 2 && giro(r[r.length - 2], r[r.length - 1], q) <= 0) r.pop();
        r.push(q);
      }
      r.pop();
      return r;
    };
    return media(v).concat(media(v.slice().reverse()));   // envolvente convexa
  }

  // ── Orden de pintado ───────────────────────────────────────────────────────
  // Ordenar por el centro de cada pieza era el error: una tabla grande y una
  // chica pueden tener el mismo centro de profundidad y aun así una tapa a la
  // otra. Por eso las puertas quedaban debajo del cuerpo y se veía el interior
  // del mueble estando cerrado.
  //
  // La regla correcta para cajas alineadas: **el eje que decide es el que NO
  // comparten**. Si dos piezas se enciman en Y y en Z, entonces X manda; si se
  // enciman en X y en Z, manda Y; si se enciman en X y en Y, manda Z. Y desde
  // #080, «más cerca» es menos x, menos y, más z.
  //
  // Preguntar eje por eje sin esa condición era lo que estaba mal: dos piezas
  // podían declararse las dos adelante, cada una por un eje distinto, y el
  // orden se rompía.
  const enc2 = (a0, a1, b0, b1) => a0 < b1 - 0.01 && b0 < a1 - 0.01;
  const cerca = (p) => p.z - (p.x + p.dx) - (p.y + p.dy);   // lo más lejos de p
  const lejos = (p) => (p.z + p.dz) - p.x - p.y;            // lo más cerca de p

  function tapa(a, b) {                                  // ¿a va delante de b?
    const ox = enc2(a.x, a.x + a.dx, b.x, b.x + b.dx);
    const oy = enc2(a.y, a.y + a.dy, b.y, b.y + b.dy);
    const oz = enc2(a.z, a.z + a.dz, b.z, b.z + b.dz);
    if (oy && oz) return a.x + a.dx <= b.x + 0.01;        // decide X
    if (ox && oz) return a.y + a.dy <= b.y + 0.01;        // decide Y
    if (ox && oy) return a.z >= b.z + b.dz - 0.01;        // decide Z
    // Sin eje compartido (piezas ya despiezadas): si toda a queda más cerca
    // que toda b en la dirección de la vista, es seguro y exacto.
    return cerca(a) >= lejos(b) - 0.01;
  }

  function ordenar(cajas) {
    const n = cajas.length;
    const c = cajas.map((p) => hondo(p.x + p.dx / 2, p.y + p.dy / 2, p.z + p.dz / 2));
    const grado = new Array(n).fill(0);
    const despues = Array.from({ length: n }, () => []);
    for (let i = 0; i < n; i++)
      for (let j = 0; j < n; j++)
        if (i !== j && tapa(cajas[i], cajas[j])) { despues[j].push(i); grado[i]++; }
    const listo = new Array(n).fill(false), orden = [];
    for (let k = 0; k < n; k++) {
      let e = -1;
      for (let i = 0; i < n; i++)
        if (!listo[i] && grado[i] === 0 && (e < 0 || c[i] < c[e])) e = i;
      // Si nadie queda libre hay un ciclo (piezas encimadas en los tres ejes).
      // No se cuelga: sigue la más lejana y se acepta el empate.
      if (e < 0)
        for (let i = 0; i < n; i++) if (!listo[i] && (e < 0 || c[i] < c[e])) e = i;
      listo[e] = true; orden.push(e);
      for (const s of despues[e]) grado[s]--;
    }
    return orden.map((i) => cajas[i]);
  }

  // encuadre: se calcula con el despiece ABIERTO del todo, así el mueble no
  // cambia de tamaño mientras se anima
  let enc = null;
  function encuadre() {
    let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    for (const f of [0, 1]) {
      for (const p of PIEZAS) {
        const q = mover(p, f);
        for (const [, pts] of caras(q)) {
          for (const v of pts) {
            const [a, b] = proy(v[0], v[1], v[2]);
            x0 = Math.min(x0, a); x1 = Math.max(x1, a);
            y0 = Math.min(y0, b); y1 = Math.max(y1, b);
          }
        }
      }
    }
    const m = 26;
    const k = Math.min((cv.width - 2 * m) / (x1 - x0), (cv.height - 2 * m) / (y1 - y0));
    return { k, ox: (cv.width - (x1 - x0) * k) / 2 - x0 * k,
             oy: (cv.height + (y1 - y0) * k) / 2 + y0 * k };
  }

  const mover = (p, f) => ({
    x: p.x + p.ex * f, y: p.y + p.ey * f, z: p.z + p.ez * f,
    dx: p.dx, dy: p.dy, dz: p.dz,
  });

  const pant = ([a, b]) => [enc.ox + a * enc.k, enc.oy - b * enc.k];

  function trazo(pts, proyectar) {
    cx.beginPath();
    pts.forEach((v, i) => {
      const [px, py] = proyectar ? pant(proy(v[0], v[1], v[2])) : pant(v);
      i ? cx.lineTo(px, py) : cx.moveTo(px, py);
    });
    cx.closePath();
  }

  function pintar(f) {
    cx.clearRect(0, 0, cv.width, cv.height);   // sin fondo: el alfa se respeta
    // pintor: de lejos a cerca, que es lo que hace que se tapen bien sin z-buffer
    const puestas = ordenar(PIEZAS.map((p) => mover(p, f)));
    cx.lineJoin = "round";
    cx.lineCap = "round";
    cx.strokeStyle = TINTA;
    for (const p of puestas) {
      // 1. las tres caras, sólidas y sin línea: primero el volumen
      for (const [cara, pts] of caras(p)) {
        trazo(pts, true);
        cx.fillStyle = TONO[cara];
        cx.fill();
      }
      // 2. las aristas internas, finas: las dos que separan cara de canto
      cx.lineWidth = 1.0;
      for (const [, pts] of caras(p)) { trazo(pts, true); cx.stroke(); }
      // 3. el contorno de la tabla, grueso: esto es lo que la hace sólida
      cx.lineWidth = 2.0;
      trazo(silueta(p), false);
      cx.stroke();
    }
  }

  // Se abre y se vuelve a cerrar, en bucle: así se ve el mueble armado y
  // despiezado sin que nadie tenga que esperar a que le toque.
  const CICLO = 5200, ESPERA = 900;
  function suave(t) { return t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2; }
  let t0 = null;
  // `__animar` lo apaga la prueba para poder fotografiar un cuadro concreto:
  // sin esto, el siguiente cuadro repinta antes de la foto y salen las tres
  // iguales — que fue justo lo que me pasó al revisarlo.
  window.__animar = true;
  window.__cuadro = (f) => pintar(f);
  function cuadro(ts) {
    if (!window.__animar) { requestAnimationFrame(cuadro); return; }
    if (t0 === null) t0 = ts;
    const t = ((ts - t0) % CICLO) / CICLO;
    const ida = Math.max(0, Math.min(1, (t - ESPERA / CICLO) / 0.38));
    const vuelta = Math.max(0, Math.min(1, (t - 0.72) / 0.24));
    pintar(suave(ida) * (1 - suave(vuelta)));
    requestAnimationFrame(cuadro);
  }

  if (PIEZAS.length) {
    enc = encuadre();
    requestAnimationFrame(cuadro);
  } else {
    // sin geometría no hay dibujo, pero el programa abre igual: el arranque es
    // un lujo y no puede ser el motivo de que no arranque nada
    cv.remove();
  }
</script>
